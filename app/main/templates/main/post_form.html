{% extends 'base.html' %}
{% from '_macros/form_macros.html' import render_field %}
{% block content %}
<h1 class="text-2xl mb-4">Create Post</h1>
<form method="post">
  {{ form.hidden_tag() }}
  {{ render_field(form.body) }}
  {{ render_field(form.url) }}
  {{ form.submit(class_='bg-blue-500 text-white px-4 py-2') }}
</form>
{% endblock %}
